<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotify CRUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Barra lateral -->
    <aside class="sidebar">
      <div class="panel">
        <div class="logo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M6.5 9.2c3.8-1.1 8-.8 11.2 1M7.2 12.4c3-.8 6.4-.5 9 .9M7.9 15.4c2.4-.6 4.9-.4 6.9.7" stroke="#000" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>
          <span>Spotify</span>
        </div>
        <nav>
          <a href="#/" data-nav="inicio" class="nav-link">
            <svg viewBox="0 0 24 24"><path d="M12 3 3 10v11h6v-6h6v6h6V10z" fill="currentColor"/></svg>Inicio
          </a>
          <a href="#/buscar" data-nav="buscar" class="nav-link">
            <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2.2" fill="none"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Buscar
          </a>
        </nav>
      </div>
      <div class="panel library">
        <div class="library-head">
          <span class="library-title">
            <svg viewBox="0 0 24 24"><path d="M4 3v18M9 3v18M14 4l6 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
            Tu biblioteca
          </span>
          <button class="icon-btn" id="btn-add-menu" title="Crear">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="chips">
          <a href="#/artistas" class="chip" data-nav="artistas">Artistas</a>
          <a href="#/canciones" class="chip" data-nav="canciones">Canciones</a>
        </div>
        <ul class="library-list" id="library-list"></ul>
      </div>
    </aside>

    <!-- Contenido principal -->
    <main class="main" id="main">
      <header class="topbar">
        <div class="search-wrap" id="search-wrap" hidden>
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2.2" fill="none"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="¿Qué quieres escuchar?" autocomplete="off">
        </div>
        <div class="topbar-actions">
          <button class="btn btn-light" data-create="artista">+ Artista</button>
          <button class="btn btn-light" data-create="cancion">+ Canción</button>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>

    <!-- Reproductor -->
    <footer class="player">
      <div class="now-playing" id="now-playing">
        <div class="np-cover placeholder"></div>
        <div class="np-text"><div class="np-title">Nada sonando</div><div class="np-artist">Elige una canción</div></div>
      </div>
      <div class="controls">
        <div class="control-btns">
          <button class="icon-btn" id="btn-prev" title="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor"/></svg></button>
          <button class="play-btn" id="btn-play" title="Reproducir"><svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
          <button class="icon-btn" id="btn-next" title="Siguiente"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z" fill="currentColor"/></svg></button>
        </div>
        <div class="progress-row">
          <span id="time-cur">0:00</span>
          <div class="progress" id="progress"><div class="progress-fill" id="progress-fill"></div></div>
          <span id="time-total">0:00</span>
        </div>
      </div>
      <div class="player-right">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
        <div class="progress vol"><div class="progress-fill" style="width:70%"></div></div>
      </div>
    </footer>
  </div>

  <!-- Modal formulario -->
  <div class="modal-backdrop" id="modal" hidden>
    <form class="modal" id="modal-form" novalidate>
      <div class="modal-head">
        <h2 id="modal-title">Crear</h2>
        <button type="button" class="icon-btn" data-close title="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="modal-preview" id="modal-preview"></div>
        <div class="fields" id="modal-fields"></div>
      </div>
      <p class="form-error" id="form-error" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close>Cancelar</button>
        <button type="submit" class="btn btn-green" id="modal-submit">Guardar</button>
      </div>
    </form>
  </div>

  <!-- Modal confirmación -->
  <div class="modal-backdrop" id="confirm" hidden>
    <div class="modal small">
      <h2 id="confirm-title">¿Eliminar?</h2>
      <p id="confirm-text" class="muted"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="confirm-no">Cancelar</button>
        <button type="button" class="btn btn-danger" id="confirm-yes">Eliminar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
